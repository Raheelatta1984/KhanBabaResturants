name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated schema is in sync
        run: |
          npm run schema:build
          git diff --exit-code lib/db/schema.ts
      - name: Typecheck
        run: npm run typecheck
      # The full data layer runs against PGlite (Postgres compiled to WASM), so
      # CI needs no database service and no secrets: schema, seed, every order
      # channel, kitchen/delivery hand-offs and production cost postings.
      - name: Postgres data-layer tests (PGlite)
        run: npm run test:pg
      - name: Build
        run: npm run build
      # The production server boots against in-process PGlite too, so the smoke
      # test exercises real pages reading a real Postgres engine.
      - name: Smoke test the running server
        run: |
          DATABASE_URL=postgres://pglite/khanbaba npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          npm run test:smoke
