name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated schema is in sync
        run: |
          npm run schema:build
          git diff --exit-code lib/db/schema.ts
      # A PR that ships without a release note leaves the "What's new" page
      # silently stale — that happened to PRs 20, 21 and 22. The note is a file
      # in whats-new/ so it travels with the code it describes.
      - name: Every release note is valid
        run: npm run whatsnew:check
      # The server does not read whats-new/ — it imports a module generated from
      # it. A note that was added without regenerating would be in the folder
      # and not in the build.
      - name: Compiled release notes are in sync
        run: |
          npm run notes:build
          git diff --exit-code lib/whats-new-notes.ts
      - name: Typecheck
        run: npm run typecheck
      # The full data layer runs against PGlite (Postgres compiled to WASM), so
      # CI needs no database service and no secrets: schema, seed, every order
      # channel, kitchen/delivery hand-offs and production cost postings.
      - name: Postgres data-layer tests (PGlite)
        run: npm run test:pg
      - name: Build
        run: npm run build
      # The production server boots against in-process PGlite too, so the smoke
      # test exercises real pages reading a real Postgres engine.
      #
      # whats-new/ is moved away first. On Vercel that folder is not packaged
      # with the functions, and a server that still needed it at runtime passed
      # here — from the checkout, where it exists — while publishing nothing in
      # production. The smoke test asserts the newest note is on the page.
      - name: Smoke test the running server
        run: |
          mv whats-new "$RUNNER_TEMP/whats-new"
          DATABASE_URL=postgres://pglite/khanbaba npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          npm run test:smoke
